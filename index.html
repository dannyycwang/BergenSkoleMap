<body>
  <header>
    <h1>Bergen 小學互動地圖</h1>
    <p>可搜尋、篩選、滑動查看，點擊學校顯示詳情</p>
  </header>

  <main>
    <aside class="left-panel">
      <input id="search" type="text" placeholder="搜尋學校名稱..." />
      <div class="controls">
        <label>最少學生數：<span id="students-value">0</span></label>
        <input id="students-range" type="range" min="0" max="800" value="0" />
        <label>定位狀態：</label>
        <select id="geo-filter">
          <option value="all">全部</option>
          <option value="matched_nominatim">精準定位</option>
          <option value="fallback_from_prepare_data">備援定位</option>
          <option value="not_found">地址查無結果</option>
          <option value="no_address_in_source">缺少地址</option>
        </select>
        <button id="fit-btn" type="button">縮放到目前篩選結果</button>
      </div>
      <p id="count"></p>
      <div id="stats" class="note"></div>
      <ul id="school-list"></ul>
    </aside>

    <section id="map"></section>

    <aside id="detail-panel" class="detail-panel hidden">
      <div class="detail-header">
        <h2 id="detail-title">學校資訊</h2>
        <button id="close-detail" type="button">✕</button>
      </div>
      <div id="detail-content" class="detail-content">請在地圖上點選學校。</div>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
