<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bergen 小學地圖</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./web/styles.css" />
</head>
<body>
  <header>
    <h1>Bergen 小學互動地圖</h1>
    <p>可搜尋、點擊查看學校資料（來源：educationBergen.xlsx）</p>
  </header>

  <main>
    <aside class="left-panel">
      <input id="search" type="text" placeholder="搜尋學校名稱..." />
      <p id="count"></p>
      <div class="note">系統會自動嘗試線上地理編碼，將近似座標更新為真實座標（結果快取在瀏覽器）。</div>
      <ul id="school-list"></ul>
    </aside>

    <section id="map"></section>

    <aside id="detail-panel" class="detail-panel hidden">
      <div class="detail-header">
        <h2 id="detail-title">學校資訊</h2>
        <button id="close-detail" type="button">✕</button>
      </div>
      <div id="detail-content" class="detail-content">請在地圖上點選學校。</div>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./web/app.js"></script>
</body>
</html>
